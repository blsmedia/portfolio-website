<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brandon Schinnour | BLS Media</title>
<meta property="og:title" content="Brandon Schinnour | BLS Media">
<meta property="og:description" content="Sports graphic design and communications.">
<meta name="description" content="Sports graphic design and communications by Brandon Schinnour, BLS Media.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens (BLS Media brief, Sept 2026) ---------- */
:root{
  --obsidian:#0C0C0E; --steel:#3A68B0; --glow:#7C9FE0; --ivory:#F4EFE7;
  --surface:#2A2A30; --panel:#222227; --surface-hi:#33333a;
  --ivory-85:rgba(244,239,231,.85); --ivory-75:rgba(244,239,231,.75); --ivory-62:rgba(244,239,231,.62);
  --display:'Familjen Grotesk','Helvetica Neue',Arial,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --cut-lg:polygon(0 0,100% 0,100% 100%,16px 100%,0 calc(100% - 16px));
  --cut-sm:polygon(0 0,100% 0,100% 100%,8px 100%,0 calc(100% - 8px));
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* The brand is dark-only, so both theme hooks resolve to the same tokens. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--obsidian:#0C0C0E;--steel:#3A68B0;--ivory:#F4EFE7;--surface:#2A2A30;--panel:#222227}
}
:root[data-theme="dark"]{--obsidian:#0C0C0E;--steel:#3A68B0;--ivory:#F4EFE7;--surface:#2A2A30;--panel:#222227}

*,*::before,*::after{box-sizing:border-box}
html{background:var(--obsidian);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 88px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--obsidian);color:var(--ivory);font:400 16px/1.6 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,video{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--ivory);outline-offset:3px}
.wrap{width:min(1200px,calc(100% - 48px));margin-inline:auto}
@media (max-width:640px){.wrap{width:calc(100% - 32px)}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:16px;top:-60px;z-index:100;background:var(--steel);padding:10px 14px;font-weight:600;text-decoration:none}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 12px)}

.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wordmark{font:500 13px/1 var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--ivory-62);text-decoration:none}

/* ---------- Buttons (flat fill, 8px corner-cut drawn on ::before so focus rings aren't clipped) ---------- */
.btn{--fill:var(--steel);position:relative;isolation:isolate;display:inline-flex;align-items:center;gap:10px;color:var(--ivory);font:600 15px/1 var(--body);padding:15px 22px 15px 24px;text-decoration:none;transition:transform .25s var(--ease)}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--fill);clip-path:var(--cut-sm);transition:background-color .25s}
.btn .ic{transition:transform .25s var(--ease)}
.btn:hover{transform:translateY(-2px)}
.btn:hover .ic{transform:translateX(4px)}
.btn:disabled{opacity:.6;cursor:progress;transform:none}
.btn-sm{padding:11px 16px;font-size:14px}
.link-btn{font:500 15px/1 var(--body);color:var(--ivory-85);padding:14px 2px;text-decoration:underline;text-underline-offset:6px;text-decoration-color:rgba(244,239,231,.35);transition:color .2s,text-decoration-color .2s}
.link-btn:hover{color:var(--ivory);text-decoration-color:var(--ivory)}
.icon-btn{position:relative;isolation:isolate;display:inline-grid;place-items:center;width:48px;height:48px;color:var(--ivory)}
.icon-btn::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--surface);clip-path:var(--cut-sm);transition:background-color .2s}
.icon-btn:hover::before{background:var(--steel)}

/* ---------- Nav ---------- */
.nav{position:fixed;inset:0 0 auto 0;z-index:50;padding-top:env(safe-area-inset-top,0px);transition:background-color .3s}
.nav.scrolled{background:rgba(12,12,14,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.nav-in{position:relative;display:flex;align-items:center;gap:28px;height:72px}
.nav-mark{margin-right:auto;padding:10px 0}
.nav-links{display:flex;gap:26px}
.nav-links button{font:500 15px/1 var(--body);color:var(--ivory-85);padding:10px 0;transition:color .2s}
.nav-links button:hover{color:var(--ivory)}
.nav-toggle{display:none}
@media (max-width:820px){
  .nav-in{gap:12px}
  .nav-links{display:none;position:absolute;top:calc(100% + 4px);right:0;flex-direction:column;gap:2px;padding:12px;min-width:210px;background:var(--panel);clip-path:var(--cut-lg)}
  .nav-links.open{display:flex}
  .nav-links button{padding:13px 12px;text-align:left}
  .nav-toggle{display:inline-grid}
}

/* ---------- Page + background sweep ---------- */
#app{min-height:100vh}
#app.entering{animation:pagein .35s ease both}
@keyframes pagein{from{opacity:0}to{opacity:1}}
.page{position:relative;isolation:isolate;overflow-x:hidden;overflow-x:clip}
.sweep{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.blob{position:absolute;aspect-ratio:1;overflow:visible;opacity:.9;will-change:transform;animation:drift var(--dur,44s) ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(0,0,0) rotate(0deg)}to{transform:translate3d(var(--dx,40px),var(--dy,-30px),0) rotate(var(--dr,7deg))}}
.home .b1{width:min(1050px,95vw);left:-30vw;top:-22vh;--dx:50px;--dy:30px;--dr:6deg}
.home .b2{width:min(900px,85vw);right:-34vw;top:100vh;--dx:-40px;--dy:40px;--dr:-8deg;--dur:52s}
.home .b3{width:min(820px,80vw);right:-34vw;top:57%;--dx:-30px;--dy:-40px;--dr:5deg;--dur:48s}
.sub .b1{width:min(960px,90vw);right:-30vw;top:-26vh;--dx:-40px;--dy:30px;--dr:-6deg}
.sub .b2{width:min(760px,80vw);left:-36vw;bottom:-24vh;--dx:40px;--dy:-30px;--dr:6deg;--dur:50s}
@media (max-width:640px){.home .b1{left:-45vw;top:-4vh}.home .b2,.home .b3{right:-60vw}}

/* ---------- Hero ---------- */
.hero{position:relative;min-height:min(100svh,920px);display:flex;align-items:flex-end;padding:120px 0 clamp(64px,11vh,128px)}
.hero-photo{position:absolute;top:0;right:0;bottom:0;width:min(62%,860px);z-index:0;background:#141417}
.hero-photo > img,.hero-photo > svg{width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.hero-photo::after{content:"";position:absolute;inset:0;background:
  linear-gradient(90deg,var(--obsidian) 0%,rgba(12,12,14,0) 42%),
  linear-gradient(0deg,var(--obsidian) 0%,rgba(12,12,14,0) 38%),
  radial-gradient(110% 90% at 62% 30%,rgba(12,12,14,.45) 0%,rgba(12,12,14,.95) 82%)}
.hero-copy{position:relative;z-index:1}
.hero-name{margin:0;font:700 clamp(48px,7.2vw,74px)/.94 var(--display);letter-spacing:-.025em}
.hero-name .line{display:block;overflow:hidden;padding-bottom:.08em}
.hero-name .line > span{display:inline-block}
.hero .wordmark{display:block;margin-top:18px;font-size:14px}
.hero-actions{display:flex;flex-wrap:wrap;align-items:center;gap:22px;margin-top:40px}
.play .hero-name .line > span{animation:rise .95s var(--ease) both;animation-delay:var(--d,0ms)}
.play .hero .wordmark{animation:fadeup .6s ease both;animation-delay:.55s}
.play .hero-actions{animation:fadeup .6s ease both;animation-delay:.7s}
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:720px){
  .hero{min-height:92svh}
  .hero-photo{width:100%;bottom:22%}
  .hero-photo::after{background:
    linear-gradient(0deg,var(--obsidian) 0%,rgba(12,12,14,0) 55%),
    radial-gradient(120% 90% at 50% 28%,rgba(12,12,14,.45) 0%,rgba(12,12,14,.95) 85%)}
}

/* ---------- Intro (asymmetric editorial) ---------- */
.intro{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;padding:clamp(72px,10vw,128px) 0 0}
.intro-tag{grid-column:1 / span 8;grid-row:1;margin:0;font:600 clamp(28px,3.7vw,44px)/1.12 var(--display);letter-spacing:-.015em;max-width:20ch}
.intro-body{grid-column:7 / span 6;grid-row:2;margin-top:12px}
.intro-body p{margin:0 0 16px;font-size:17px;color:var(--ivory-85);max-width:54ch}
.intro-body p:first-child{color:var(--ivory)}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 24px;margin:32px 0 0}
.roles div{display:grid;gap:3px}
.roles dt{font:500 13px/1.3 var(--body);color:var(--ivory-62)}
.roles dd{margin:0;font:500 16px/1.4 var(--body)}
@media (max-width:820px){.intro-tag,.intro-body{grid-column:1 / -1}}
@media (max-width:480px){.roles{grid-template-columns:1fr}}

/* ---------- Sections ---------- */
.section{padding-top:clamp(80px,10vw,128px)}
.section-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,46ch);gap:10px 48px;align-items:end;margin-bottom:44px}
.section-head h2{margin:0;font:600 clamp(22px,2.4vw,28px)/1.2 var(--display);letter-spacing:-.005em}
.section-head p{margin:0;color:var(--ivory-75)}
@media (max-width:720px){.section-head{grid-template-columns:1fr}}
.num{font:500 15px/1 var(--display);letter-spacing:.04em;color:var(--ivory-62);font-variant-numeric:tabular-nums}

/* ---------- Team cards (stacked rows, sticker logos) ---------- */
.team-list{list-style:none;margin:0;padding:0;display:grid;gap:22px}
.team-card{--team:var(--steel);position:relative;isolation:isolate;display:grid;grid-template-columns:52px 128px minmax(0,1fr) 40px;align-items:center;gap:0 22px;min-height:136px;padding:14px 30px 14px 28px;color:var(--ivory);text-decoration:none;transition:transform .3s var(--ease)}
.team-card::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--surface);clip-path:var(--cut-lg);transition:background-color .3s var(--ease)}
.team-card:hover,.team-card:focus-visible{transform:translateY(-4px)}
.team-card:hover::before,.team-card:focus-visible::before{background:var(--team)}
.team-card:hover .num,.team-card:focus-visible .num{color:var(--ivory-85)}
.tc-logo{align-self:center;margin:0;width:128px;transform:none;transition:transform .4s var(--ease);filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.tc-logo{height:104px;display:flex;align-items:center;justify-content:center}
.tc-logo > img{max-width:100%;max-height:100%;width:auto;height:auto}
.tc-logo > svg{height:90%;width:auto}
.svc-row-icon{filter:none}
.svc-row-icon .svc-icon{width:84px;height:84px}
.svc-row-icon .svc-icon .ic{width:40px;height:40px;stroke-width:1.5}
@media (max-width:640px){.svc-row-icon .svc-icon{width:56px;height:56px}.svc-row-icon .svc-icon .ic{width:28px;height:28px}}
.team-list li:nth-child(even) .tc-logo{--tilt-h:6deg}
.team-card:hover .tc-logo,.team-card:focus-visible .tc-logo{transform:translateY(-6px) rotate(var(--tilt-h,-6deg))}
.tc-name{display:block;font:700 clamp(26px,3.1vw,38px)/1.05 var(--display);letter-spacing:-.01em}
.tc-role{display:block;margin-top:8px;font:500 15px/1.35 var(--body);color:var(--ivory-75)}
.team-card:hover .tc-role,.team-card:focus-visible .tc-role{color:var(--ivory)}
.go .ic{width:26px;height:26px;transition:transform .3s var(--ease)}
.team-card:hover .go .ic,.team-card:focus-visible .go .ic,.svc-card:hover .go .ic,.svc-card:focus-visible .go .ic,.next-card:hover .go .ic,.next-card:focus-visible .go .ic{transform:translateX(6px)}
@media (max-width:640px){
  .team-list{gap:16px}
  .team-card{grid-template-columns:26px 64px minmax(0,1fr) 22px;gap:0 12px;min-height:104px;padding:12px 16px}
  .tc-logo{width:66px;height:60px;margin:0}
  .num{font-size:13px}
  .go .ic{width:22px;height:22px}
}

/* ---------- Service cards ---------- */
.svc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:1000px) and (min-width:721px){.svc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.svc-card{--team:var(--steel);position:relative;isolation:isolate;display:flex;flex-direction:column;min-height:230px;padding:28px 28px 26px;color:var(--ivory);text-decoration:none;transition:transform .3s var(--ease)}
.svc-card::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--surface);clip-path:var(--cut-lg);transition:background-color .3s var(--ease)}
.svc-card:hover,.svc-card:focus-visible{transform:translateY(-4px)}
.svc-card:hover::before,.svc-card:focus-visible::before{background:var(--team)}
.svc-card:hover .num,.svc-card:focus-visible .num{color:var(--ivory-85)}
.svc-top{display:flex;justify-content:space-between;align-items:flex-start}
.svc-icon{display:grid;place-items:center;width:92px;height:92px;background:var(--obsidian);clip-path:var(--cut-sm);transition:transform .4s var(--ease)}
.svc-icon .ic{width:46px;height:46px;stroke-width:1.5}
.svc-card:hover .svc-icon,.svc-card:focus-visible .svc-icon{transform:translateY(-4px) rotate(-6deg)}
.svc-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-top:auto;padding-top:32px}
.svc-card h3{margin:0 0 2px;font:700 clamp(28px,2.9vw,36px)/1.05 var(--display);letter-spacing:-.01em}
@media (max-width:720px){.svc-grid{grid-template-columns:1fr}.svc-card{min-height:200px;padding:22px}.svc-icon{width:76px;height:76px}.svc-icon .ic{width:38px;height:38px}}

/* ---------- About ---------- */
.about-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(32px,6vw,88px);align-items:center}
.about-photo{position:relative;aspect-ratio:4/5;background:#141417;clip-path:var(--cut-lg);overflow:hidden}
.about-photo > img,.about-photo > svg{width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.about-copy h2{margin:0 0 20px;font:600 clamp(22px,2.4vw,28px)/1.2 var(--display)}
.about-copy .lede{margin:0 0 18px;font:600 clamp(24px,2.6vw,30px)/1.25 var(--display);letter-spacing:-.01em;max-width:24ch}
.about-copy p{margin:0 0 16px;font-size:17px;color:var(--ivory-85);max-width:58ch}
.about-copy .roles{margin-top:30px}
@media (max-width:820px){.about-grid{grid-template-columns:1fr}.about-photo{max-width:420px}}

/* ---------- Contact ---------- */
.cform{position:relative;isolation:isolate;padding:clamp(24px,4vw,48px)}
.cform::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--panel);clip-path:var(--cut-lg)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px 24px}
.span2{grid-column:1 / -1}
.field{display:grid;gap:8px;border:0;margin:0;padding:0;min-width:0}
.field > span,.field > legend{font:500 14px/1.3 var(--body);color:var(--ivory-85);padding:0}
.field > legend{margin-bottom:10px}
.field em{font-style:normal;font-weight:400;color:var(--ivory-62);margin-left:6px}
.field input,.field textarea{width:100%;background:var(--surface);color:var(--ivory);border:0;border-radius:0;font:400 16px/1.5 var(--body);padding:14px 16px;box-shadow:inset 0 -2px 0 transparent;transition:box-shadow .2s,background-color .2s}
.field textarea{resize:vertical;min-height:150px}
.field input::placeholder,.field textarea::placeholder{color:rgba(244,239,231,.4)}
.field input:focus,.field textarea:focus{outline:none;background:var(--surface-hi);box-shadow:inset 0 -2px 0 var(--ivory)}
.field [aria-invalid="true"]{box-shadow:inset 3px 0 0 var(--ivory),inset 0 -2px 0 var(--ivory)}
.err{min-height:0;font:500 13px/1.35 var(--body);color:var(--ivory)}
.err:empty{display:none}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{position:relative;display:inline-flex}
.chip input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.chip span{position:relative;isolation:isolate;display:inline-flex;align-items:center;gap:8px;padding:12px 16px;font:500 14px/1 var(--body);pointer-events:none}
.chip span::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--surface);clip-path:var(--cut-sm);transition:background-color .2s}
.chip:hover span::before{background:var(--surface-hi)}
.chip input:checked + span::before{background:var(--steel)}
.chip input:focus-visible + span{outline:2px solid var(--ivory);outline-offset:3px}
.chip .ic{width:16px;height:16px}
.form-foot{display:flex;flex-wrap:wrap;align-items:center;gap:20px;margin-top:30px}
.form-status{margin:0;font-size:15px;color:var(--ivory-75)}
.sent h3{margin:0 0 10px;font:600 28px/1.2 var(--display)}
.sent p{margin:0;color:var(--ivory-85);max-width:54ch}
.sent:focus{outline:none}
@media (max-width:640px){.fgrid{grid-template-columns:1fr}}

/* ---------- Footer ---------- */
.foot{padding:clamp(96px,12vw,140px) 0 calc(40px + env(safe-area-inset-bottom,0px))}
.foot-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px 32px}
.foot p{margin:0;font-size:14px;color:var(--ivory-62)}
.foot-links{display:flex;flex-wrap:wrap;gap:22px}
.foot-links button{font:500 14px/1 var(--body);color:var(--ivory-75);padding:8px 0}
.foot-links button:hover{color:var(--ivory)}

/* ---------- Sub pages ---------- */
.sub-head{padding-top:calc(120px + env(safe-area-inset-top,0px))}
.back{display:inline-flex;align-items:center;gap:8px;font:500 15px/1 var(--body);color:var(--ivory-75);padding:10px 0;transition:color .2s}
.back .ic{transition:transform .25s var(--ease)}
.back:hover{color:var(--ivory)}
.back:hover .ic{transform:translateX(-4px)}
.sub-title{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(20px,3vw,36px);align-items:center;margin-top:36px}
.sub-logo{width:clamp(104px,13vw,168px);filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.sub-logo > img,.sub-logo > svg{width:100%;height:auto}
.sub-logo.is-icon{display:grid;place-items:center;aspect-ratio:1;background:var(--surface);clip-path:var(--cut-lg);filter:none}
.sub-logo.is-icon .ic{width:46%;height:46%}
.sub-title h1{margin:0;font:700 clamp(40px,6vw,66px)/1 var(--display);letter-spacing:-.025em}
.sub-role{margin:12px 0 0;font:500 16px/1.4 var(--body);color:var(--ivory-75)}
.sub-blurb{margin:30px 0 0;max-width:60ch;font-size:17px;color:var(--ivory-85)}
.gal-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 20px;margin:56px 0 24px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filter{position:relative;isolation:isolate;padding:11px 16px;font:500 14px/1 var(--body);color:var(--ivory-85)}
.filter::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--surface);clip-path:var(--cut-sm);transition:background-color .2s}
.filter:hover::before{background:var(--surface-hi)}
.filter[aria-pressed="true"]{color:var(--ivory)}
.filter[aria-pressed="true"]::before{background:var(--steel)}
.filter .count{margin-left:7px;color:var(--ivory-62)}
.filter[aria-pressed="true"] .count{color:var(--ivory-85)}
.gal-note{margin:0;font-size:14px;color:var(--ivory-62)}

.gallery{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:88px;grid-auto-flow:dense;gap:16px}
.s-lg{grid-column:span 8;grid-row:span 4}
.s-sm{grid-column:span 4;grid-row:span 2}
.s-md{grid-column:span 4;grid-row:span 3}
.s-wd{grid-column:span 6;grid-row:span 3}
.tile{position:relative;display:block;color:var(--ivory);width:100%;height:100%}
.tile-clip{position:absolute;inset:0;overflow:hidden;background:var(--surface);clip-path:var(--cut-lg)}
.tile-media{position:absolute;inset:0;transition:transform .7s var(--ease)}
.tile-media > img{width:100%;height:100%;object-fit:cover}
.tile:hover .tile-media,.tile:focus-visible .tile-media{transform:scale(1.035)}
.ph{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;font:500 13px/1 var(--body);color:var(--ivory-62)}
.ph .ic{width:28px;height:28px}

  var id = "s" + (++uid);
  return '<svg class="blob '+cls+'" viewBox="0 0 800 800" aria-hidden="true" focusable="false"><defs>'+
    '<linearGradient id="g'+id+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C9FE0"/><stop offset=".32" stop-color="#3A68B0"/><stop offset=".68" stop-color="#0C0C0E"/></linearGradient>'+
    '<filter id="f'+id+'" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">'+
      '<feGaussianBlur in="SourceGraphic" stdDeviation="34" result="soft"/>'+
      '<feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch" result="noise"/>'+
      '<feColorMatrix in="noise" type="matrix" values=".33 .33 .33 0 0  .33 .33 .33 0 0  .33 .33 .33 0 0  0 0 0 0 1" result="mono"/>'+
      '<feComposite in="mono" in2="soft" operator="in" result="grain"/>'+
      '<feComponentTransfer in="grain" result="grainSoft"><feFuncA type="linear" slope=".42"/></feComponentTransfer>'+
      '<feBlend in="grainSoft" in2="soft" mode="overlay"/>'+
    '</filter></defs><g'+(flip?' transform="translate(800 0) scale(-1 1)"':'')+'><path d="'+path+'" fill="url(#g'+id+')" filter="url(#f'+id+')"/></g></svg>';
}

var gal = {items:[], filter:"all", showClub:false, list:[], open:{}, seen:{}, sectioned:false};

function masonryTile(item, i){
  var src = item.kind==="photo" ? item.src : item.poster;
  var kindLabel = item.kind==="video" ? "video" : "image";
  var club = gal.showClub && item.club ? '<span class="tile-club">'+esc(item.club)+'</span>' : "";
  return '<button type="button" class="tile m reveal" style="--d:'+((i%4)*60)+'ms" data-i="'+i+'" aria-label="'+esc(item.title)+(item.club?", "+esc(item.club):"")+', '+kindLabel+'. Open viewer">'+
    '<span class="tile-frame'+(item.yt ? ' yt' : '')+(item.vertical ? ' v' : '')+'">'+(src ? '<img src="'+esc(src)+'" alt="" loading="lazy" decoding="async">' : '<span class="ph">'+ic(item.kind)+'</span>')+
    (item.kind==="video" ? '<span class="play-btn">'+ic("play")+'</span>' : '')+'</span>'+
    ((item.notitle && !club && !item.credit) ? '' : '<span class="tile-meta">'+(item.notitle ? '' : '<span class="tile-title">'+esc(item.title)+'</span>')+club+(item.credit ? '<span class="tile-credit">'+esc(item.credit)+'</span>' : '')+'</span>')+'</button>';
}
function tileHTML(item, i){
  if(gal.masonry) return masonryTile(item, i);
  var size = PATTERN[i % PATTERN.length];
  var media;
  if(item.kind==="photo" && item.src) media = '<img src="'+esc(item.src)+'" alt="" loading="lazy">';
  else if(item.kind==="video" && item.poster) media = '<img src="'+esc(item.poster)+'" alt="" loading="lazy">';
  else media = '<span class="ph '+item.kind+'">'+(item.kind==="photo"?ic("photo"):"")+'<span>'+(item.kind==="photo"?"Add image":"Add video")+'</span></span>';
  var kindLabel = item.kind==="video" ? "Video" : "Image";
  var club = gal.showClub && item.club ? '<span class="tile-club">'+esc(item.club)+'</span>' : "";
  return '<button type="button" class="tile s-'+size+' reveal" style="--d:'+((i%6)*60)+'ms" data-i="'+i+'" aria-label="'+esc(item.title)+(item.club?", "+esc(item.club):"")+', '+kindLabel.toLowerCase()+'. Open viewer">'+
    '<span class="tile-clip"><span class="tile-media">'+media+'</span>'+
    (item.kind==="video" ? '<span class="play-btn">'+ic("play")+'</span>' : '')+
    '<span class="tile-kind">'+ic(item.kind)+kindLabel+'</span>'+
    '<span class="tile-cap"><span class="num">'+pad(i+1)+'</span><span><span class="tile-title">'+esc(item.title)+'</span>'+club+'</span></span>'+
    '</span></button>';
}

function catOf(x){ return x.kind==="video" ? "video" : (x.cat==="graphic" ? "graphic" : "photo"); }
function renderFilters(){
  var counts = {all:gal.items.length, graphic:0, photo:0, video:0};
  gal.items.forEach(function(x){ counts[catOf(x)]++; });
  var opts = [["all","All"],["graphic","Graphics"],["photo","Photos"],["video","Videos"]].filter(function(o){ return o[0]==="all" || counts[o[0]] > 0; });
  var fEl = document.getElementById("filters");

  fEl.innerHTML = opts.map(function(o){
    return '<button type="button" class="filter" data-filter="'+o[0]+'" aria-pressed="'+(gal.filter===o[0])+'">'+o[1]+'<span class="count">'+counts[o[0]]+'</span></button>';

}

/* Place each tile in the currently shortest column (first row stays in order). */
function estH(it){ if(it.yt) return it.vertical ? 1.78 : 0.5625; var k = (it.src||"").replace(/^images\//,"").replace(/\.[a-z0-9]+$/i,""); return RATIO[k] || 1.25; }
function distribute(items, n, make){
  var cols = [], h = [];
  for(var c=0;c<n;c++){ cols.push([]); h.push(0); }
  items.forEach(function(it, i){
    var k = 0; for(var c=1;c<n;c++) if(h[c] < h[k] - 0.001) k = c;
    cols[k].push(make(it, i)); h[k] += estH(it) + 0.12;
  });
  return cols;
}
function masonryCols(){ var w = window.innerWidth; return w > 1100 ? 4 : w > 720 ? 3 : 2; }
window.addEventListener("resize", function(){
  if(!document.getElementById("gallery") || masonryCols() === gal.cols) return;
  if(gal.sectioned) renderSections(); else if(gal.masonry) renderGrid();
});
function renderGrid(){
  var g = document.getElementById("gallery");
  gal.list = gal.filter==="all" ? gal.items.slice() : gal.items.filter(function(x){ return catOf(x)===gal.filter; });
  gal.masonry = gal.list.length > 0 && gal.list.every(function(x){ return x.kind==="photo" ? !!x.src : !!x.poster; });
  g.classList.toggle("masonry", gal.masonry);
  if(gal.masonry){
    var n = masonryCols(), cols = distribute(gal.list, n, tileHTML);
    gal.cols = n;
    g.innerHTML = cols.map(function(c){ return '<div class="mcol">'+c.join("")+'</div>'; }).join("");
    observeReveals(g);
    return;
  }
  g.innerHTML = gal.list.length ? gal.list.map(tileHTML).join("") :
    '<p class="gal-empty">'+(gal.filter==="all" ? 'More examples coming soon.' : 'No '+({video:"videos",graphic:"graphics",photo:"photos"}[gal.filter]||"pieces")+' in this collection yet.')+'</p>';
  observeReveals(g);
}

function bindGallery(kind, slug){
  gal.items = (GALLERY[kind+":"+slug] || []).filter(isReal);
  var note = document.querySelector(".gal-note"); if(note) note.hidden = !gal.items.length;
  gal.filter = "all";
  gal.showClub = kind==="service";
  gal.sectioned = false;
  if(kind==="org" && gal.items.length && gal.items.every(isReal)){ bindSections(); return; }
  renderFilters(); renderGrid();
  document.getElementById("filters").addEventListener("click", function(e){
    var b = e.target.closest("[data-filter]"); if(!b) return;
    gal.filter = b.getAttribute("data-filter");
    renderFilters(); renderGrid();
    var again = document.querySelector('[data-filter="'+gal.filter+'"]'); if(again) again.focus();
  });
  document.getElementById("gallery").addEventListener("click", function(e){
    var t = e.target.closest(".tile"); if(!t) return;
    openLB(parseInt(t.getAttribute("data-i"),10), t);
  });
}

function renderSections(focusCat){
  var g = document.getElementById("gallery"), n = masonryCols();
  gal.cols = n;
  g.className = "gal-sections";
  g.innerHTML = SECTIONS.map(function(sd){
    var c = sd[0], items = gal.items.filter(function(x){ return catOf(x)===c; });
    if(!items.length) return "";
    var open = !!gal.open[c], shown = open ? items : items.slice(0, n);
    var cols = distribute(shown, n, masonryTile);
    var extra = items.length - n;
    return '<section class="gsec" data-cat="'+c+'" id="gsec-'+c+'" aria-labelledby="gsec-'+c+'-h">'+
      '<div class="gsec-head reveal"><h2 id="gsec-'+c+'-h">'+sd[1]+'</h2><span class="gsec-count">'+items.length+' piece'+(items.length===1?'':'s')+'</span></div>'+
      '<div class="gallery masonry">'+cols.map(function(col){ return '<div class="mcol">'+col.join("")+'</div>'; }).join("")+'</div>'+
      (extra > 0 ? '<div class="more-row"><button type="button" class="btn btn-quiet more-btn" data-cat="'+c+'" aria-expanded="'+open+'" aria-controls="gsec-'+c+'">'+
        (open ? 'Show less' : 'Load more <span class="more-count">'+extra+'</span>')+'</button></div>' : '')+
    '</section>';
  }).join("");
  // tiles that were already on screen shouldn't fade in again
  g.querySelectorAll(".gsec").forEach(function(sec){
    var head = sec.querySelector(".gsec-head");
    if(gal.seen[sec.getAttribute("data-cat")]){ head.classList.add("in"); sec.querySelectorAll(".tile").forEach(function(t){ if(+t.getAttribute("data-i") < n) t.classList.add("in"); }); }
  });
  observeReveals(g);
  if(focusCat){ var b = g.querySelector('.more-btn[data-cat="'+focusCat+'"]'); if(b) b.focus({preventScroll:true}); }
}
function bindSections(){
  gal.open = {}; gal.seen = {}; gal.sectioned = true;
  document.getElementById("filters").hidden = true;
  renderSections();
  var g = document.getElementById("gallery");
  g.addEventListener("click", function(e){
    var mb = e.target.closest(".more-btn");
    if(mb){
      var c = mb.getAttribute("data-cat"), wasOpen = !!gal.open[c];
      SECTIONS.forEach(function(sd){ gal.seen[sd[0]] = true; });
      gal.open[c] = !wasOpen;
      renderSections(c);
      if(wasOpen){ var sec = document.getElementById("gsec-"+c); if(sec) scrollToId("gsec-"+c, true); }
      return;
    }
    var t = e.target.closest(".tile"); if(!t) return;
    var c2 = t.closest(".gsec").getAttribute("data-cat");
    gal.list = gal.items.filter(function(x){ return catOf(x)===c2; });
    openLB(parseInt(t.getAttribute("data-i"),10), t);
  });
}

/* ================= "More" page rails ================= */
function moreHTML(){
  return '<div class="more-groups">'+MORE.map(function(g, gi){
    if(!g.items.some(isReal)) return "";
    var hid = "mg-"+gi;
    return '<section class="more-group reveal" data-g="'+gi+'" aria-labelledby="'+hid+'">'+
      '<div class="mg-head"><div class="mg-id">'+(g.logo ? '<span class="mg-logo"><img src="'+esc(g.logo)+'" alt=""></span>' : '')+'<div><h2 id="'+hid+'">'+esc(g.name)+'</h2><span class="mg-count">'+(g.note ? esc(g.note) : g.items.length+' piece'+(g.items.length===1?'':'s'))+'</span></div></div>'+
      '<div class="mg-arrows"><button type="button" class="icon-btn" data-dir="-1" aria-label="Scroll '+esc(g.name)+' back">'+ic("prev")+'</button><button type="button" class="icon-btn" data-dir="1" aria-label="Scroll '+esc(g.name)+' forward">'+ic("next")+'</button></div></div>'+
      '<div class="rail'+(g.items.every(isReal) ? ' real' : '')+'" tabindex="0" aria-label="'+esc(g.name)+' work, scrolls sideways">'+g.items.map(railTile).join("")+'</div>'+
    '</section>';
  }).join("")+'</div>'+
  '<p class="gal-note" style="margin-top:28px">Select any piece to view it larger.</p>';
}
function railTile(item, i){
  if(isReal(item)) return masonryTile(item, i).replace(/ class="tile m reveal"/, ' class="tile m"').replace(/ style="--d:[^"]*"/, "").replace(' loading="lazy"', '');
  gal.masonry = false;
  return tileHTML(item, i).replace(/ class="tile s-[a-z]+ reveal"/, ' class="tile"').replace(/ style="--d:[^"]*"/, "");
}
function bindMore(){
  document.querySelectorAll(".more-group").forEach(function(sec){
    var g = MORE[+sec.getAttribute("data-g")], rail = sec.querySelector(".rail"), arrows = sec.querySelector(".mg-arrows");
    var prev = arrows.querySelector('[data-dir="-1"]'), next = arrows.querySelector('[data-dir="1"]');
    function update(){
      var max = rail.scrollWidth - rail.clientWidth;
      arrows.hidden = max <= 2;
      prev.disabled = rail.scrollLeft <= 2;
      next.disabled = rail.scrollLeft >= max - 2;
    }
    arrows.addEventListener("click", function(e){
      var b = e.target.closest("[data-dir]"); if(!b || b.disabled) return;
      rail.scrollBy({left: +b.getAttribute("data-dir") * rail.clientWidth * 0.9, behavior: reduce.matches ? "auto" : "smooth"});
    });
    rail.addEventListener("scroll", update, {passive:true});
    window.addEventListener("resize", update);
    rail.addEventListener("click", function(e){
      var t = e.target.closest(".tile"); if(!t) return;
      gal.list = g.items; gal.showClub = false;
      openLB(parseInt(t.getAttribute("data-i"),10), t);
    });
    rail.querySelectorAll("img").forEach(function(im){ if(!im.complete) im.addEventListener("load", update); });
    update();
  });
}

document.addEventListener("error", function(e){
  var t = e.target;
  if(t && t.tagName==="IMG" && t.parentNode && t.parentNode.classList && t.parentNode.classList.contains("icon-only")){
    var a = t.parentNode; a.classList.remove("icon-only"); a.removeAttribute("title"); a.removeAttribute("aria-label");
    a.innerHTML = esc(a.getAttribute("data-label"))+ic("out")+'<span class="sr-only"> (opens in a new tab)</span>'; return;
  }
  if(t && t.tagName==="IMG" && t.closest && t.closest(".tile-frame.yt, .yt-out")){ t.closest(".tile-frame, .yt-out").classList.add("noimg"); t.remove(); }
}, true);
/* ================= Lightbox ================= */
var lb = document.getElementById("lb"), lbIndex = 0, lbReturn = null;
function lbShow(i){
  var n = gal.list.length; lbIndex = (i + n) % n;
  var item = gal.list[lbIndex], frame = document.getElementById("lbFrame"), html;
  frame.classList.toggle("fit", item.kind==="photo" && !!item.src);
  frame.classList.toggle("yt", !!item.yt);
  frame.classList.toggle("v", !!item.vertical);
  if(item.yt){
    var watch = ytLink(item);
    html = (EMBED_VIDEO && !item.ext)
      ? '<iframe src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(item.yt)+'?autoplay=1&rel=0&modestbranding=1" title="'+esc(item.title)+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>'
      : '<div class="yt-out"><img src="'+esc(item.poster)+'" alt=""><a class="btn" href="'+watch+'" target="_blank" rel="noopener noreferrer">Watch on '+(/facebook\.com/.test(watch)?"Facebook":/instagram\.com/.test(watch)?"Instagram":/tiktok\.com/.test(watch)?"TikTok":"YouTube")+' '+ic("out")+'<span class="sr-only"> (opens in a new tab)</span></a></div>';
  } else
  if(item.kind==="photo" && item.src) html = '<img src="'+esc(item.src)+'" alt="'+esc(item.title)+'">';
  else if(item.kind==="video" && item.src) html = '<video controls preload="none" playsinline src="'+esc(item.src)+'"'+(item.poster?' poster="'+esc(item.poster)+'"':'')+'></video>';
  else html = '<div class="ph">'+ic(item.kind)+'<span>'+(item.kind==="photo"?"Image coming soon":"Video coming soon")+'</span></div>';
  frame.innerHTML = html;
  document.getElementById("lbCount").textContent = pad(lbIndex+1)+" / "+pad(n);
  document.getElementById("lbTitle").textContent = item.notitle ? "" : item.title;
  document.getElementById("lbClub").textContent = [item.club, item.credit].filter(Boolean).join(", ");
}
function openLB(i, from){ var it = gal.list[(i + gal.list.length) % gal.list.length]; if(it && it.ext){ window.open(ytLink(it), "_blank", "noopener"); return; } lbReturn = from || null; lbShow(i); if(typeof lb.showModal==="function") lb.showModal(); else lb.setAttribute("open",""); document.getElementById("lbClose").focus(); }
function closeLB(){ var vid = lb.querySelector("video"); if(vid) vid.pause(); if(lb.open) lb.close(); document.getElementById("lbFrame").innerHTML=""; }
lb.addEventListener("close", function(){ var vid = lb.querySelector("video"); if(vid) vid.pause(); document.getElementById("lbFrame").innerHTML=""; if(lbReturn && document.contains(lbReturn)) lbReturn.focus(); });
lb.addEventListener("click", function(e){ if(e.target===lb) closeLB(); });
lb.addEventListener("keydown", function(e){
  if(e.key==="ArrowRight"){ e.preventDefault(); lbShow(lbIndex+1); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); lbShow(lbIndex-1); }
});
document.getElementById("lbPrev").innerHTML = ic("prev");
document.getElementById("lbNext").innerHTML = ic("next");
document.getElementById("lbClose").innerHTML = ic("close");
document.getElementById("lbPrev").addEventListener("click", function(){ lbShow(lbIndex-1); });
document.getElementById("lbNext").addEventListener("click", function(){ lbShow(lbIndex+1); });
document.getElementById("lbClose").addEventListener("click", closeLB);

/* ================= Contact form ================= */
function bindForm(){
  var f = document.getElementById("cform"); if(!f) return;
  var checks = {
    name: function(v){ return v.trim().length>0 || "Enter your name."; },
    email: function(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()) || "Enter an email address like name@team.com."; },
    message: function(v){ return v.trim().length>=10 || "Add a few details about the project (10 characters or more)."; }
  };
  function check(k){
    var el = f.elements[k], res = checks[k](el.value), err = f.querySelector('[data-err="'+k+'"]');
    if(res!==true){ el.setAttribute("aria-invalid","true"); err.textContent = res; return false; }
    el.removeAttribute("aria-invalid"); err.textContent = ""; return true;
  }
  Object.keys(checks).forEach(function(k){
    f.elements[k].addEventListener("input", function(){ if(this.getAttribute("aria-invalid")) check(k); });
  });
  f.addEventListener("submit", function(e){
    e.preventDefault();
    var firstBad = null;
    Object.keys(checks).forEach(function(k){ if(!check(k) && !firstBad) firstBad = f.elements[k]; });
    if(firstBad){ firstBad.focus(); return; }
    var data = {name:f.elements.name.value.trim(), email:f.elements.email.value.trim(), org:f.elements.org.value.trim(),
      need:[].map.call(f.querySelectorAll('input[name="need"]:checked'), function(x){ return x.value; }).join(", "), message:f.elements.message.value.trim()};
    var status = f.querySelector(".form-status"), btn = f.querySelector('button[type="submit"]');
    if(!CONTACT_ENDPOINT && CONTACT_EMAIL){
      var body = data.message + "\n\n" + data.name + (data.org ? ", " + data.org : "") + "\n" + data.email;
      window.location.href = "mailto:" + CONTACT_EMAIL + "?subject=" + encodeURIComponent("Project inquiry: " + (data.need || "BLS Media")) + "&body=" + encodeURIComponent(body);
      status.textContent = "Your email app should open with your message ready to send.";
      return;
    }
    if(!CONTACT_ENDPOINT){ showSent(f, data, false); return; }
    data._subject = "Portfolio inquiry from " + data.name + (data.need ? " (" + data.need + ")" : "");
    btn.disabled = true; status.textContent = "Sending your message\u2026";
    fetch(CONTACT_ENDPOINT, {method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"}, body:JSON.stringify(data)})
      .then(function(r){ if(!r.ok) throw new Error("bad status"); showSent(f, data, true); })
      .catch(function(){ btn.disabled = false; status.textContent = "Message not sent. Check your connection and try again."; });
  });
}
function showSent(f, d, live){
  var first = esc(d.name.split(/\s+/)[0]);
  f.innerHTML = live
    ? '<div class="sent" tabindex="-1"><h3>Message sent</h3><p>Thanks, '+first+'. I&rsquo;ll reply to '+esc(d.email)+' soon.</p></div>'
    : '<div class="sent" tabindex="-1"><h3>Message not sent</h3><p>Thanks, '+first+'. This form isn&rsquo;t connected to an inbox yet, so your message wasn&rsquo;t sent.</p></div>';
  f.querySelector(".sent").focus();
}

/* ================= Reveal on scroll ================= */
var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
var io = ("IntersectionObserver" in window) ? new IntersectionObserver(function(entries){
  entries.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); } });
}, {rootMargin:"0px 0px -8% 0px", threshold:0.12}) : null;
function observeReveals(root){
  var els = (root||document).querySelectorAll(".reveal:not(.in)");
  els.forEach(function(el){ if(!io || reduce.matches) el.classList.add("in"); else io.observe(el); });
}

/* ================= Router + nav ================= */
var app = document.getElementById("app"), nav = document.getElementById("nav");
var navLinks = document.getElementById("navLinks"), navToggle = document.getElementById("navToggle");
var firstHome = true, pending = null;
navToggle.innerHTML = ic("menu");

function parse(){
  var h = location.hash.replace(/^#\/?/, "").split("/");
  if((h[0]==="org" || h[0]==="service") && findPage(h[0], h[1])) return {kind:h[0], slug:h[1]};
  return {kind:"home"};
}
function scrollToId(id, smooth){
  var el = document.getElementById(id); if(!el) return;
  var y = id==="top" ? 0 : el.getBoundingClientRect().top + window.pageYOffset - 84;
  window.scrollTo({top:Math.max(0,y), behavior:(smooth && !reduce.matches) ? "smooth" : "auto"});
}
function closeMenu(){ navLinks.classList.remove("open"); navToggle.setAttribute("aria-expanded","false"); navToggle.setAttribute("aria-label","Open menu"); navToggle.innerHTML = ic("menu"); }

function render(){
  var r = parse();
  if(lb.open) closeLB();
  app.classList.remove("entering","play");
  void app.offsetWidth;
  if(r.kind==="home"){
    app.innerHTML = homeHTML();
    if(firstHome && !reduce.matches) app.classList.add("play");
    firstHome = false;
    bindForm();
    document.title = "Brandon Schinnour | BLS Media";
  } else {
    app.innerHTML = subHTML(r.kind, r.slug);
    if(r.slug==="more" && r.kind==="org") bindMore(); else bindGallery(r.kind, r.slug);
    document.title = findPage(r.kind, r.slug).item.name + " | BLS Media";
    firstHome = false;
  }
  app.classList.add("entering");
  observeReveals(app);
  closeMenu();
  if(pending){ var id = pending; pending = null; requestAnimationFrame(function(){ scrollToId(id, false); }); }
  else window.scrollTo(0,0);
  onScroll();
}

document.addEventListener("click", function(e){
  var g = e.target.closest("[data-goto]");
  if(g){
    e.preventDefault();
    var id = g.getAttribute("data-goto");
    closeMenu();
    if(parse().kind==="home") scrollToId(id, true);
    else { pending = id; location.hash = "#/"; }
    return;
  }
  var home = e.target.closest('a[href="#/"]');
  if(home && parse().kind==="home" && (location.hash==="#/" || location.hash==="")){ e.preventDefault(); scrollToId("top", true); }
});
navToggle.addEventListener("click", function(){
  var open = !navLinks.classList.contains("open");
  navLinks.classList.toggle("open", open);
  navToggle.setAttribute("aria-expanded", String(open));
  navToggle.setAttribute("aria-label", open ? "Close menu" : "Open menu");
  navToggle.innerHTML = ic(open ? "close" : "menu");
});
document.addEventListener("keydown", function(e){ if(e.key==="Escape" && navLinks.classList.contains("open")){ closeMenu(); navToggle.focus(); } });

function onScroll(){ nav.classList.toggle("scrolled", window.pageYOffset > 24); }
window.addEventListener("scroll", onScroll, {passive:true});
window.addEventListener("hashchange", render);
render();
})();
</script>
